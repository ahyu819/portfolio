<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <title>关于我 · Ahyu的作品集</title>
</head>
<body>
    <header>
        <div class="nav-pill">
            <div class="nav-logo">
                <div class="nav-logo-ring">
                    <div class="nav-logo-inner">A</div>
                </div>
            </div>
            <span class="nav-divider"></span>
            <a class="nav-link" href="index.html#hero">首页</a>
            <a class="nav-link" href="index.html#works">作品</a>
            <a class="nav-link" href="index.html#gallery">图集</a>
            <a class="nav-link" href="index.html#contact">联系</a>
            <span class="nav-divider"></span>
            <a class="nav-link" href="works.html">全部作品</a>
            <a class="nav-sayhi active" href="about.html">
                <span class="nav-sayhi-bg"></span>
                <span class="nav-sayhi-inner">关于我</span>
            </a>
        </div>
    </header>

    <div class="page-hero">
        <h1>关于我</h1>
        <p>简历式简介，求职时直接发给招聘方看</p>
    </div>

    <section class="reveal">
        <div class="section-header">
            <div class="section-eyebrow">Profile</div>
            <h2>个人简介</h2>
        </div>
        <p class="section-sub">在这里写一段自我介绍：你是谁、做什么的、擅长什么、想找什么方向的工作。里程碑 5 时我们一起来填。</p>
    </section>

    <section class="reveal">
        <div class="section-header">
            <div class="section-eyebrow">Skills</div>
            <h2>技能</h2>
        </div>
        <div class="skills">
            <span class="skill-chip">技能 1</span>
            <span class="skill-chip">技能 2</span>
            <span class="skill-chip">技能 3</span>
        </div>
    </section>

    <section class="reveal">
        <div class="section-header">
            <div class="section-eyebrow">Experience</div>
            <h2>经历</h2>
        </div>
        <div class="timeline">
            <div class="timeline-item">
                <div class="time">20xx 年 - 至今</div>
                <h3>经历占位标题</h3>
                <p>在这里描述一段教育或工作经历。</p>
            </div>
            <div class="timeline-item">
                <div class="time">20xx 年 - 20xx 年</div>
                <h3>经历占位标题</h3>
                <p>在这里描述另一段经历。</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 张三 · 用爱搭建</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
