<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css?v=52">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <title>全部作品 · Ahyu的作品集</title>
</head>
<body class="no-bg-edge">
    <header>
        <div class="nav-pill">
            <div class="nav-logo">
                <div class="nav-logo-ring">
                    <div class="nav-logo-inner">A</div>
                </div>
            </div>
            <span class="nav-divider"></span>
            <a class="nav-link" href="index.html#hero">首页</a>
            <a class="nav-link" href="index.html#works">作品</a>
            <a class="nav-link" href="index.html#gallery">图集</a>
            <a class="nav-link" href="index.html#contact">联系</a>
            <span class="nav-divider"></span>
            <a class="nav-sayhi active" href="works.html">
                <span class="nav-sayhi-bg"></span>
                <span class="nav-sayhi-inner">全部作品</span>
            </a>
            <a class="nav-sayhi" href="about.html">
                <span class="nav-sayhi-bg"></span>
                <span class="nav-sayhi-inner">关于作者</span>
            </a>
        </div>
    </header>

    <div class="page-hero">
        <h1>全部作品</h1>
        <p>点击作品缩略图查看详情；底部导航切换分类，筛选框按题材过滤</p>
        <div class="works-tagbar" id="works-tagbar">
            <button class="tag-chip" type="button" data-tag="硬表面">硬表面</button>
            <button class="tag-chip" type="button" data-tag="人物">人物</button>
            <button class="tag-chip" type="button" data-tag="场景">场景</button>
            <span class="tagbar-hint">选中即筛选 · 空选即全都在</span>
        </div>
    </div>

    <div id="works-grid-wrap" class="reveal">
        <div id="works-grid" class="works-grid"></div>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="作品分类">
        <button class="bnav-btn" type="button" data-cat="精选">精选</button>
        <button class="bnav-btn" type="button" data-cat="图片">图片</button>
        <button class="bnav-btn" type="button" data-cat="视频">视频</button>
    </nav>

    <div id="snapshot" class="snapshot" role="dialog" aria-modal="true">
        <button class="snapshot-close" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="snapshot-inner">
            <div id="snapshot-media" class="snapshot-media"></div>
            <div class="snapshot-info">
                <h2 id="snapshot-title"></h2>
                <div class="snapshot-meta">
                    <span id="snapshot-type" class="work-chip"></span>
                </div>
                <p id="snapshot-desc"></p>
                <div id="snapshot-tags" class="detail-tags"></div>
                <div id="snapshot-gallery" class="snapshot-gallery"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Ahyu · 用爱搭建</p>
    </footer>

    <div id="lightbox">
        <div class="lightbox-ring">
            <div class="lightbox-inner" id="lightbox-media"></div>
        </div>
        <div class="lightbox-hint">滚轮 / 双指缩放 · 点击空白关闭</div>
    </div>

    <script src="js/main.js?v=9"></script>
    <script src="js/site-data.js?v=1"></script>
    <script src="js/works.js?v=14"></script>
    <script type="importmap">
        {
            "imports": {
                "ogl": "./js/vendor/ogl/ogl.module.js?v=1",
                "three": "./js/vendor/three/three.module.js?v=1",
                "three/addons/": "./js/vendor/three/addons/"
            }
        }
    </script>
    <script type="module" src="js/model-viewer.js?v=1"></script>
    <script type="module" src="js/prism.js?v=2"></script>
    <script src="js/fabmenu.js?v=6"></script>
</body>
</html>
