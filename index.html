<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css?v=50">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <title>Ahyu的作品集</title>
</head>
<body>
    <header>
        <div class="nav-pill">
            <div class="nav-logo">
                <div class="nav-logo-ring">
                    <div class="nav-logo-inner">A</div>
                </div>
            </div>
            <span class="nav-divider"></span>
            <a class="nav-link" href="#hero">首页</a>
            <a class="nav-link" href="#works">作品</a>
            <a class="nav-link" href="#gallery">图集</a>
            <a class="nav-link" href="#contact">联系</a>
            <span class="nav-divider"></span>
            <a class="nav-sayhi" href="works.html">
                <span class="nav-sayhi-bg"></span>
                <span class="nav-sayhi-inner">全部作品</span>
            </a>
            <a class="nav-sayhi" href="about.html">
                <span class="nav-sayhi-bg"></span>
                <span class="nav-sayhi-inner">关于作者</span>
            </a>
        </div>
    </header>

    <div id="scene3d" aria-hidden="true"></div>

    <section id="hero">
        <div class="hero-inner">
            <h1>你好，我是阿宇 Ahyu</h1>
            <p class="hero-role">三维设计 · 作品记录站</p>
            <p class="hero-desc">全流程独立完成，作品持续更新，欢迎交流与合作。</p>
        </div>
        <button class="model-next-btn" type="button">NEXT</button>
        <a class="scroll-hint" href="#works" aria-label="向下滑动">
            <svg width="14" height="56" viewBox="0 0 14 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 1 V50" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M1.5 45 L7 52 L12.5 45" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span>向下滑动</span>
        </a>
    </section>

    <section id="works">
        <div class="section-header">
            <div class="section-eyebrow">Featured Works</div>
            <h2>精选作品</h2>
            <p class="section-sub">精选作品有更加详细的创作过程说明</p>
        </div>
        <div class="works-grid" id="featured-grid"></div>
        <div class="works-more reveal">
            <a class="more-btn" href="works.html">
                <span class="more-btn-fx"></span>
                <span class="more-btn-inner">查看全部作品</span>
            </a>
        </div>
    </section>

    <section id="gallery">
        <div class="section-header">
            <div class="section-eyebrow">Gallery</div>
            <h2>作品图集</h2>
            <p class="section-sub">随机展示部分，点击放大</p>
        </div>
        <div class="gallery-cols" id="gallery-cols"></div>
        <div class="works-more reveal">
            <a class="more-btn" href="works.html">
                <span class="more-btn-fx"></span>
                <span class="more-btn-inner">查看全部作品</span>
            </a>
        </div>
    </section>

    <section id="contact">
        <div class="section-header">
            <div class="section-eyebrow">Contact</div>
            <h2>联系我</h2>
            <p class="section-sub">合作、交流、招聘，都可以随时找我</p>
        </div>
        <div class="contact-card reveal">
            <a class="contact-item" href="mailto:2827290813@qq.com">邮箱：2827290813@qq.com</a>
            <div class="contact-item">微信：zhenhaoya500</div>
        </div>
    </section>

    <footer>
        <p>© 2026 Ahyu · 用爱搭建</p>
    </footer>

    <div id="lightbox">
        <div class="lightbox-ring">
            <div class="lightbox-inner" id="lightbox-media"></div>
        </div>
        <div class="lightbox-hint">滚轮 / 双指缩放 · 点击空白关闭</div>
    </div>

    <script src="js/main.js?v=9"></script>
    <script src="js/site-data.js?v=1"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "./js/vendor/three/three.module.js?v=1",
                "three/addons/": "./js/vendor/three/addons/",
                "ogl": "./js/vendor/ogl/ogl.module.js?v=1"
            }
        }
    </script>
    <script type="module" src="js/scene3d.js?v=18"></script>
    <script type="module" src="js/lightrays.js?v=1"></script>
    <script type="module" src="js/gradientwaves.js?v=3"></script>
    <script src="js/fabmenu.js?v=6"></script>
</body>
</html>
